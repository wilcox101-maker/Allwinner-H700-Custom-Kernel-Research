# ReduxOS SSH defaults (docs/reduxos-distro-build.md §3). Host keys are generated per unit on
# first boot (h700-firstboot); none ship in the image.
PermitRootLogin no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
# Beta: password login for the user account (its password must be changed at first login).
# Set "PasswordAuthentication no" once a key is in ~/.ssh/authorized_keys.
PasswordAuthentication yes
