# R7 card layout (provisional until R1): MBR; SPL+u-boot raw at 8 KiB; FAT32 /boot; ext4 root.
# The root partition is created at its content size and grown to the card on first boot.
image boot.vfat {
	vfat {
		label = "BOOT"
		extraargs = "-F 32"
	}
	mountpoint = "/boot"
	size = 256M
}

image root.ext4 {
	ext4 {
		label = "rootfs"
		use-mke2fs = true
		features = "^metadata_csum_seed"
	}
	size = 594M
}

image rg34xxsp-noble-20261114-deb.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x48373030
	}
	partition boot {
		partition-type = 0x0c
		bootable = true
		offset = 16M
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "root.ext4"
	}
}
