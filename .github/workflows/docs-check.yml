# SPDX-License-Identifier: GPL-2.0-only
# Doc consistency on every PR (Manager file 2026-11-15-d): relative links resolve, master-list ids are
# unique and cover every id cited in research-sync, named handoffs exist. scripts/check-docs.py; stdlib only.
name: docs-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Check docs
        run: python3 -I scripts/check-docs.py
