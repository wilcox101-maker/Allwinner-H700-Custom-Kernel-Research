# R13 (optional, shipped disabled with systemd-oomd masked until K12): if oomd is enabled, it acts on
# the user session (where the frontend and emulators run) only under sustained memory pressure.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
